      <rect x="60" y="300" width="83" height="28" rx="14" fill="#e6e9f1"/><text x="80" y="319">PPTX</text>
      <rect x="151" y="300" width="72" height="28" rx="14" fill="#e6e9f1"/><text x="174" y="319">PDF</text>
      <rect x="231" y="300" width="124" height="28" rx="14" fill="#e6e9f1"/><text x="250" y="319">7 ДАТАСЕТОВ</text>
      <rect x="363" y="300" width="178" height="28" rx="14" fill="#e6e9f1"/><text x="382" y="319">3 ПРЕДМЕТНЫЕ ТЕМЫ</text>
    </g>
    <rect x="866" y="57" width="447" height="264" rx="23" fill="#171b29" transform="rotate(4 1090 189)" opacity=".11"/>
