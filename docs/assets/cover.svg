    <circle cx="1188" cy="218" r="52" fill="none" stroke="#8792f9" stroke-width="20"/>
    <circle cx="1188" cy="218" r="52" fill="none" stroke="#ffd64f" stroke-width="20" stroke-dasharray="205 327" transform="rotate(-90 1188 218)"/>
    <path d="M1321 44v34M1304 61h34" stroke="#fb745d" stroke-width="5" stroke-linecap="round"/>
