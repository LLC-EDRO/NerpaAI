<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
  <title id="title">NerpaAI — видеопрезентация проекта</title>
  <desc id="desc">Обложка со значком воспроизведения. Нажмите, чтобы посмотреть видео на Google Drive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#222954"/>
      <stop offset="1" stop-color="#4656dc"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-width="1" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1400" height="350" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="350" rx="28" fill="url(#grid)"/>
  <circle cx="1250" cy="50" r="230" fill="#8492ff" opacity=".12"/>
  <circle cx="1325" cy="320" r="170" fill="#a2adff" opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="48" width="320" height="30" rx="15" fill="#fff" opacity=".13"/>
    <text x="80" y="68" fill="#e4e7ff" font-size="12" font-weight="700" letter-spacing="1.7">ВИДЕОПРЕЗЕНТАЦИЯ ПРОЕКТА</text>
    <text x="58" y="157" fill="#fff" font-size="70" font-weight="800" letter-spacing="-3">Nerpa<tspan fill="#ffd64f">AI</tspan></text>
    <text x="61" y="211" fill="#e7eaff" font-size="28" font-weight="700">От идеи — к готовой презентации.</text>
    <text x="61" y="286" fill="#fff" font-size="19" font-weight="700">Смотреть видео <tspan fill="#ffd64f">↗</tspan></text>
    <circle cx="1125" cy="175" r="90" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="1125" cy="175" r="69" fill="#ffd64f"/>
    <path d="M1108 143L1156 175L1108 207Z" fill="#242a50" stroke="#242a50" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
